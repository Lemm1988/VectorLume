[package]
name = "vectorlume"
description = "VectorLume - Laser-Software fuer GRBL-Diodenlaser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vectorlume"
path = "src/main.rs"

[dependencies]
vl-core.workspace = true
vl-raster.workspace = true
vl-io.workspace = true
vl-cam.workspace = true
vl-device.workspace = true
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
rfd.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
nokhwa.workspace = true
sys-locale.workspace = true
log.workspace = true
env_logger.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
