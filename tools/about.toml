# cargo-about: zulässige Lizenzen der mitgelieferten Bibliotheken (tools\package.ps1 → THIRD-PARTY-LICENSES.html).
# Bei Wahlmöglichkeiten („MIT OR Apache-2.0“) gilt die Reihenfolge dieser Liste. Kommt eine Bibliothek mit einer hier
# nicht aufgeführten Lizenz hinzu, bricht die Paketierung ab – dann Lizenz prüfen (keine GPL), bevor sie ergänzt wird.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "IJG",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Eigene Crates (publish = false) nicht aufführen
private = { ignore = true }
